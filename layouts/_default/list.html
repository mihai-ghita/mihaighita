{{ define "main" }}
<div class="container">
    <div class="list-header">
        <h1>{{ .Title }}</h1>
        {{ if .Content }}
        <div class="list-description">{{ .Content }}</div>
        {{ end }}
    </div>

    <div class="posts-grid">
        {{ range .Pages }}
            {{ partial "post-card.html" . }}
        {{ else }}
        <p class="no-posts">No posts found in this category yet.</p>
        {{ end }}
    </div>
</div>
{{ end }}
