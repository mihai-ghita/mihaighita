<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    <title>{{ if .Title }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>

    {{ $mainCSS := resources.Get "css/main.css" | resources.Minify }}
    {{ $blogCSS := resources.Get "css/blog.css" | resources.Minify }}
    {{ $homepageCSS := resources.Get "css/homepage.css" | resources.Minify }}
    <link rel="stylesheet" href="{{ $mainCSS.RelPermalink }}">
    <link rel="stylesheet" href="{{ $blogCSS.RelPermalink }}">
    <link rel="stylesheet" href="{{ $homepageCSS.RelPermalink }}">
</head>
